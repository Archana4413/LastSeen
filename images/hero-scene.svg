<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#A1887F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Wall & Background Window Light -->
  <rect width="600" height="400" rx="16" fill="url(#wall)"/>
  <rect x="30" y="30" width="160" height="180" rx="8" fill="#FFFFFF" opacity="0.6"/>
  <rect x="40" y="40" width="65" height="75" rx="4" fill="#DBEAFE"/>
  <rect x="115" y="40" width="65" height="75" rx="4" fill="#DBEAFE"/>
  <rect x="40" y="125" width="65" height="75" rx="4" fill="#DBEAFE"/>
  <rect x="115" y="125" width="65" height="75" rx="4" fill="#DBEAFE"/>

  <!-- Wooden Table Surface -->
  <polygon points="0,220 600,200 600,400 0,400" fill="url(#table)"/>
  <line x1="0" y1="220" x2="600" y2="200" stroke="#8D6E63" stroke-width="2"/>

  <!-- Potted Houseplant (Aloe / Succulent) -->
  <ellipse cx="380" cy="210" rx="42" ry="12" fill="#000000" opacity="0.12"/>
  <path d="M345 170L355 210H405L415 170Z" fill="#F5F5F4" filter="url(#shadow)"/>
  <ellipse cx="380" cy="170" rx="35" ry="8" fill="#D6D3D1"/>
  <ellipse cx="380" cy="170" rx="32" ry="6" fill="#78350F"/>
  <!-- Plant leaves -->
  <path d="M380 170 Q370 110 330 95 Q365 130 376 170Z" fill="#15803D"/>
  <path d="M380 170 Q385 100 375 75 Q390 120 382 170Z" fill="#16A34A"/>
  <path d="M380 170 Q400 110 435 90 Q405 130 385 170Z" fill="#22C55E"/>
  <path d="M380 170 Q350 140 310 140 Q350 160 377 170Z" fill="#15803D"/>
  <path d="M380 170 Q410 135 450 145 Q410 165 383 170Z" fill="#16A34A"/>

  <!-- Laptop / Tablet (angled) -->
  <g transform="translate(140, 210) rotate(-6)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#64748B" filter="url(#shadow)"/>
    <rect x="8" y="8" width="164" height="104" rx="4" fill="#0F172A"/>
    <rect x="18" y="18" width="80" height="8" rx="4" fill="#38BDF8"/>
    <rect x="18" y="34" width="130" height="4" rx="2" fill="#94A3B8"/>
    <rect x="18" y="44" width="100" height="4" rx="2" fill="#475569"/>
    <rect x="18" y="54" width="115" height="4" rx="2" fill="#475569"/>
    <!-- Map graphic on screen -->
    <rect x="90" y="66" width="60" height="35" rx="3" fill="#1E293B"/>
    <circle cx="120" cy="80" r="5" fill="#EF4444"/>
    <circle cx="120" cy="80" r="10" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Leather Wallet -->
  <g transform="translate(430, 240) rotate(12)">
    <rect x="0" y="0" width="85" height="55" rx="6" fill="#3E2723" filter="url(#shadow)"/>
    <rect x="2" y="2" width="81" height="51" rx="5" fill="#5D4037"/>
    <path d="M50 16H85V38H50C46 38 43 35 43 31V23C43 19 46 16 50 16Z" fill="#4E342E"/>
    <circle cx="68" cy="27" r="4" fill="#FFD54F"/>
    <path d="M10 8H45" stroke="#8D6E63" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Keychain with Keys -->
  <g transform="translate(330, 280) rotate(-15)">
    <ellipse cx="25" cy="25" rx="18" ry="18" fill="#000000" opacity="0.15"/>
    <circle cx="20" cy="20" r="14" stroke="#94A3B8" stroke-width="4" fill="none"/>
    <!-- Key 1 -->
    <path d="M30 25 L75 55 L70 60 L62 55 L58 58 L54 53 L26 31" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="5" fill="#94A3B8"/>
    <!-- Key 2 (Brass) -->
    <path d="M22 28 L55 70 L48 72 L45 66 L41 68 L38 63 L19 32" fill="#FCD34D" stroke="#D97706" stroke-width="1.5"/>
    <!-- Leather fob -->
    <rect x="-10" y="8" width="18" height="30" rx="4" fill="#1D4ED8"/>
    <text x="-7" y="27" fill="#FFFFFF" font-size="8" font-family="sans-serif" font-weight="bold">RVU</text>
  </g>

  <!-- Wireless Earbuds Case (White pod) -->
  <g transform="translate(250, 310)">
    <ellipse cx="30" cy="25" rx="24" ry="16" fill="#000000" opacity="0.12"/>
    <rect x="8" y="8" width="44" height="30" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
    <line x1="8" y1="20" x2="52" y2="20" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="30" cy="27" r="2" fill="#22C55E"/>
  </g>

  <!-- Floating Pin Badge (Find What Matters) -->
  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="150" height="50" rx="25" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="25" cy="25" r="16" fill="#EFF6FF"/>
    <path d="M25 15C21 15 18 18 18 22C18 28 25 35 25 35C25 35 32 28 32 22C32 18 29 15 25 15Z" fill="#2563EB"/>
    <circle cx="25" cy="22" r="3" fill="#FFFFFF"/>
    <text x="50" y="24" fill="#1E293B" font-size="12" font-family="sans-serif" font-weight="bold">Last Seen</text>
    <text x="50" y="38" fill="#10B981" font-size="10" font-family="sans-serif" font-weight="600">● 100% Tracked</text>
  </g>
</svg>
